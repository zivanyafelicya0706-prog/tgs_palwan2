#include <iostream>
using namespace std;

int main() {
    string makanan[2] = {"soto", "rawon"};
    int harga[2] = {15000, 20000};
    int porsi[2];
    int total, totalSemua = 0;
    int i = 0;

    do {
        cout << "makanan" << endl;
        cout << makanan[i] << endl;
        cout << "harga" << endl;
        cout << harga[i] << endl;
        cout << "porsi: ";
        cin >> porsi[i];

        total = harga[i] * porsi[i];
        totalSemua += total;

        cout << "total" << endl;
        cout << total << endl;
        cout << "********************" << endl;

        i++;
    } while (i < 2);

    cout << "Total semua = " << totalSemua << endl;

    return 0;
}
