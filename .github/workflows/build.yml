name: Build C++ to EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Install compiler Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Compile menjadi EXE
        run: |
          echo "Daftar file:"
          find . -maxdepth 5 -type f

          SOURCE=$(find . -type f -iname "*.cpp" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: File CPP tidak ditemukan!"
            exit 1
          fi

          echo "File yang dikompilasi: $SOURCE"

          x86_64-w64-mingw32-g++ \
            "$SOURCE" -o mini-kasir.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mini-kasir-exe
          path: mini-kasir.exe
