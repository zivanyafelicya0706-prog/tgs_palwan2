```yaml
name: Build C++ to EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.cpp
          if (-not $files) {
            throw "File .cpp tidak ditemukan!"
          }

          foreach ($file in $files) {
            $output = [System.IO.Path]::GetFileNameWithoutExtension($file.Name) + ".exe"
            g++ $file.FullName -o $output

            if ($LASTEXITCODE -ne 0) {
              throw "Compile gagal: $($file.Name)"
            }
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe-windows
          path: '*.exe'
          if-no-files-found: error
```
